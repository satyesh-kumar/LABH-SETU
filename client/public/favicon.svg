<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="lsGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="50%" stop-color="#184f85" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Modern Geometric Squircle Frame -->
  <rect width="48" height="48" rx="12" fill="url(#lsGrad)" />
  
  <!-- Subtle Inner Border Glow -->
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Modern Geometric Bridge Arch ("Setu") -->
  <path d="M12 32 C 14 19, 34 19, 36 32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M17 32 C 19 24, 29 24, 31 32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" fill="none" />

  <!-- Luminous Prosperity / Benefit Star Node ("Labh") -->
  <circle cx="24" cy="17" r="4.5" fill="url(#amberGrad)" />
  <circle cx="24" cy="17" r="1.8" fill="#ffffff" />

  <!-- Bridge Anchors -->
  <circle cx="12" cy="32" r="2.2" fill="#38bdf8" />
  <circle cx="36" cy="32" r="2.2" fill="#38bdf8" />
</svg>
