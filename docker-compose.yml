version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: labhsetu-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: labhsetu
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: labhsetu-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/labhsetu
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:5000
      JWT_SECRET: labhsetu_production_docker_secret_key_change_me
      STORAGE_PROVIDER: local
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
    volumes:
      - server-uploads:/app/uploads

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: labhsetu-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: labhsetu-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server

volumes:
  mongo-data:
  server-uploads:
